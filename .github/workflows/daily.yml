name: Gunluk Instagram paylasimi

# Turkiye saati (UTC+3): ogle gonderisi ~12:00, aksam Reels'i ~19:00.
# GitHub zamanlanmis isleri birkac dakika gecikmeli baslatabildigi icin 8 dakika erken tetiklenir.
on:
  schedule:
    - cron: "52 8 * * *"    # 11:52 TR -> ogle (gorsel gonderi)
    - cron: "52 15 * * *"   # 18:52 TR -> aksam (Reels)
  workflow_dispatch:
    inputs:
      slot:
        description: "Hangi paylasim? ogle = gorsel gonderi, aksam = Reels"
        type: choice
        options: [ogle, aksam]
        default: ogle
      konu:
        description: "Konuyu zorla (bos birak = takvime gore)"
        required: false
      mod:
        description: "test = uret+yukle+Instagram'da hazirla ama YAYINLAMA, uret = sadece dosya uret, paylas = gercekten paylas"
        type: choice
        options: [test, uret, paylas]
        default: test

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Uret ve paylas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_KONU: ${{ github.event.inputs.konu }}
          IN_MOD: ${{ github.event.inputs.mod }}
        run: |
          if [ "$EVENT_SCHEDULE" = "52 8 * * *" ]; then SLOT=ogle;
          elif [ "$EVENT_SCHEDULE" = "52 15 * * *" ]; then SLOT=aksam;
          else SLOT="${IN_SLOT:-ogle}"; fi
          ARGS="--slot $SLOT"
          if [ -n "$IN_KONU" ]; then ARGS="$ARGS --konu $IN_KONU"; fi
          if [ "$IN_MOD" = "test" ]; then ARGS="$ARGS --test"; fi
          if [ "$IN_MOD" = "uret" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Calisiyor: $ARGS"
          python -m bot.main $ARGS
      - name: Uretilen dosyalari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icerik-${{ github.run_id }}
          path: out/
          retention-days: 14
