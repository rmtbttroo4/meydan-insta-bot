name: Seslendirme uret

# Bir seslendirme metin dosyasindaki (assets/seslendirme/*.json) satirlari Turkce yapay sesle okur, WAV olarak indirilebilir yapar.
on:
  workflow_dispatch:
    inputs:
      dosya:
        description: "Metin dosyasi"
        default: "assets/seslendirme/turbobox.json"

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Piper kurulum
        run: pip install piper-tts
      - name: Seslendir (Gemini varsa Gemini, yoksa Piper)
        env:
          DOSYA: ${{ github.event.inputs.dosya }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then python - <<'PY'
          import json, os, wave, base64, time, urllib.request, urllib.error
          cfg = json.load(open(os.environ["DOSYA"], encoding="utf-8"))
          key = os.environ["GEMINI_API_KEY"].strip()
          model = cfg.get("gemini_model", "gemini-2.5-flash-preview-tts")
          voice = cfg.get("gemini_ses", "Puck")
          stil = cfg.get("stil", "Neşeli, samimi ve enerjik bir Türk reklam spikeri gibi, doğal Türkçe telaffuzla söyle:")
          os.makedirs("ses_out", exist_ok=True)
          for k, txt in cfg["satirlar"].items():
              body = {"contents": [{"parts": [{"text": f"{stil} {txt}"}]}],
                      "generationConfig": {"responseModalities": ["AUDIO"],
                                           "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": voice}}}}}
              for deneme in range(4):
                  try:
                      req = urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                                                   data=json.dumps(body).encode(), headers={"Content-Type": "application/json", "x-goog-api-key": key})
                      r = json.load(urllib.request.urlopen(req, timeout=120))
                      pcm = base64.b64decode(r["candidates"][0]["content"]["parts"][0]["inlineData"]["data"]); break
                  except urllib.error.HTTPError as ex:
                      print("hata", k, ex.code, ex.read()[:300]); time.sleep(20 * (deneme + 1))
              else:
                  raise SystemExit(f"{k} seslendirilemedi")
              with wave.open(f"ses_out/{k}.wav", "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(24000); w.writeframes(pcm)
              print("gemini", voice, k, len(pcm)); time.sleep(7)
          PY
          exit 0; fi
          python - <<'PY'
          import json, os, wave, urllib.request
          cfg = json.load(open(os.environ["DOSYA"], encoding="utf-8"))
          import subprocess
          adaylar = [cfg.get("ses", "tr_TR-fahrettin-medium"), "tr_TR-fahrettin-medium", "tr_TR-fettah-medium", "tr_TR-dfki-medium"]
          ses = None
          for c in adaylar:
              lang, rest = c.split("-", 1); name, q = rest.rsplit("-", 1)
              base = f"https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/{lang}/{name}/{q}/{c}"
              try:
                  for ext in (".onnx", ".onnx.json"): urllib.request.urlretrieve(base + ext, c + ext)
                  ses = c; break
              except Exception as ex:
                  print("indirilemedi", c, ex)
                  r = subprocess.run(["python", "-m", "piper.download_voices", c]); 
                  if r.returncode == 0 and os.path.exists(c + ".onnx"): ses = c; break
          print("kullanilan ses:", ses)
          from piper import PiperVoice
          v = PiperVoice.load(ses + ".onnx")
          os.makedirs("ses_out", exist_ok=True)
          for key, txt in cfg["satirlar"].items():
              path = f"ses_out/{key}.wav"
              with wave.open(path, "wb") as w:
                  try:
                      from piper import SynthesisConfig
                      v.synthesize_wav(txt, w, syn_config=SynthesisConfig(length_scale=cfg.get("hiz", 1.0)))
                  except ImportError:
                      v.synthesize(txt, w, length_scale=cfg.get("hiz", 1.0))
              print(key, os.path.getsize(path))
          PY
      - name: Ciktiyi ayri dala yaz (seslendirme-cikti)
        run: |
          git config user.name "meydan-bot"; git config user.email "bot@users.noreply.github.com"
          AD=$(basename "${{ github.event.inputs.dosya }}" .json)
          git fetch origin seslendirme-cikti || true
          git checkout --orphan tmp_ses && git rm -rq --cached . && mkdir -p cikti/$AD && mv ses_out/*.wav cikti/$AD/
          git add -f cikti && git commit -qm "Seslendirme: $AD" && git push -f origin HEAD:seslendirme-cikti
